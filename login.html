<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dán đoạn này vào trong thẻ <head> của cả login.html và nhanvien.html -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- 👉 BỔ SUNG LOGO CHUẨN CHO THIẾT BỊ APPLE (IPHONE/IPAD) -->
<link rel="apple-touch-icon" href="https://homestechjsc.vn/wp-content/uploads/2026/06/logo-HTWork.png">
    <title>Đăng Nhập Hệ Thống - HomesTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white tracking-wide">HomesTech ERP</h1>
            <p class="text-xs text-slate-400 mt-1">Cổng đăng nhập dành cho Kỹ thuật viên</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Tài khoản</label>
                <div class="relative">
                    <i class="fa fa-user absolute left-3 top-3.5 text-slate-500 text-sm"></i>
                    <input id="login-username" type="text" placeholder="Nhập tài khoản được cấp..." class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none focus:border-blue-500 text-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Mật khẩu</label>
                <div class="relative">
                    <i class="fa fa-lock absolute left-3 top-3.5 text-slate-500 text-sm"></i>
                    <input id="login-password" type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none focus:border-blue-500 text-white">
                </div>
            </div>

            <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition active:scale-95 shadow-lg mt-2">
                Đăng nhập hệ thống
            </button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBroVaPiuBOMKxGngnBqBOdGhYVT4fS-to",
        authDomain: "dbwork-homestech.firebaseapp.com",
        databaseURL: "https://dbwork-homestech-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "dbwork-homestech"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    document.getElementById('btn-login').addEventListener('click', async () => {
        const userVal = document.getElementById('login-username').value.trim().toLowerCase();
        const passVal = document.getElementById('login-password').value.trim();

        if(!userVal || !passVal) return alert("Vui lòng nhập đủ tài khoản và mật khẩu!");

        // Tìm node của user đó trên nhánh users/
        const userRef = ref(rtdb, "users/" + userVal);
        const snapshot = await get(userRef);

        if(snapshot.exists()) {
            const userData = snapshot.val();
            // Kiểm tra mật khẩu
            if(userData.password === passVal) {
                // Lưu lại thông tin vào trình duyệt để trang nhanvien.html đọc
                localStorage.setItem('logged_staff_name', userData.name);
                alert("Đăng nhập thành công! Đang chuyển hướng...");
                window.location.href = "nhanvien.html"; // Chuyển sang trang nhận việc
            } else {
                alert("Sai mật khẩu! Vui lòng kiểm tra lại.");
            }
        } else {
            alert("Tài khoản không tồn tại trên hệ thống HomesTech!");
        }
    });
</script>
</body>
</html>
